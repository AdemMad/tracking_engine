settings:
  model: denormalized
  save: true
  output_name: tracking_compacted
  frame_bucket_size: 500
  ball_possession:
    column_name: has_ball_possession
    distance_m: 1.5
    min_frames: 1
  speed_bands:
    column_name: player_speed_band
    standing_max_m_s: 0.2               # <= 0.2
    walking_max_m_s: 2.0
    jogging_max_m_s: 4.0
    running_max_m_s: 5.5
    high_speed_running_max_m_s: 7.0     # <= 7.0
  patterns:
    column_name: event_type
    closest_frame: 0.85                  # fallback max touch distance when no event-specific band is set
    persist_frames: 5                    # keep the detected event label on this many frames total
    pass/shot/clearance:
      frame_sequence: 8
      start_distance_min: 0.8           # search this band for the last close-contact frame before release
      start_distance_max: 0.85
      leaving_distance: 1.5
      min_speed: 5.2
  player_ball_distance:
    column_name: player_ball_distance
  zones:
    pitch_zone_column: pitch_zone
    ball_zone_column: ball_zone
    penalty_box_depth_m: 16.5
    wide_channel_depth_m: 35.0
    penalty_box_side_inset_m: 13.84
    central_band_divisor: 6.0
  pitch_defaults:
    length_m: 105.0
    width_m: 68.0
  parquet:
    row_group_size: 250000
    compression: zstd
    target_compacted_file_size_mb: 300

local:
  read_from: C:\Users\adamm\Downloads\track\data\tracking
  export_to: C:\Users\adamm\Downloads\track\data\curated
  metadata_from: C:\Users\adamm\Downloads\track\data\metadata

aws_s3:
  read_from: 's3://<bucket-name>/<key-name>/tracking'
  export_to: 'C:\Users\adamm\Downloads\tracking_files\tracking\curated'
  metadata_from: 'C:\Users\adamm\Downloads\tracking_files\metadata'
  storage_options:
    key: '<aws-access-key-id>'
    secret: '<aws-secret-access-key>'
    client_kwargs:
      region_name: '<aws-region>'

azure_blob:
  read_from: 'az://<container>/tracking'
  export_to: 'C:\Users\adamm\Downloads\tracking_files\tracking\curated'
  metadata_from: 'C:\Users\adamm\Downloads\tracking_files\metadata'
  storage_options:
    account_name: '<azure-storage-account>'
    account_key: '<azure-storage-key>'

adls:
  read_from: 'abfss://<container>@<account>.dfs.core.windows.net/tracking'
  export_to: 'C:\Users\adamm\Downloads\tracking_files\tracking\curated'
  metadata_from: 'C:\Users\adamm\Downloads\tracking_files\metadata'
  storage_options:
    account_name: '<adls-account-name>'
    account_key: '<adls-account-key>'
